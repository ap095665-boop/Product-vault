<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Future Product</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050816;
color:white;
overflow-x:hidden;

}

/* Animated Background */

.bg{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
z-index:-2;

background:linear-gradient(
-45deg,
#07142c,
#0d203c,
#182848,
#081520
);

background-size:400% 400%;

animation:bgMove 12s infinite ease;

}

@keyframes bgMove{

0%{background-position:0 50%;}
50%{background-position:100% 50%;}
100%{background-position:0 50%;}

}

/* Floating Glow */

.glow{

position:fixed;

width:220px;
height:220px;

border-radius:50%;

background:#00ffd5;

filter:blur(120px);

opacity:.18;

animation:float 10s infinite alternate;

z-index:-1;

}

.g1{

top:10%;
left:5%;

}

.g2{

bottom:15%;
right:8%;

background:#4d7cff;

animation-delay:2s;

}

@keyframes float{

to{

transform:

translateY(-60px)
translateX(50px);

}

}

/* Hero */

.hero{

padding:40px 20px;

text-align:center;

}

/* Product */

.product{

width:320px;

max-width:95%;

margin:auto;

padding:20px;

border-radius:24px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(16px);

border:1px solid rgba(255,255,255,.15);

box-shadow:

0 0 35px rgba(0,255,255,.15);

}

.product img{

width:100%;

border-radius:20px;

transition:.5s;

}

.product img:hover{

transform:scale(1.04);

}

h1{

margin:18px 0 8px;

font-size:28px;

}

.rating{

color:gold;

margin-bottom:12px;

}

.desc{

line-height:1.6;

opacity:.85;

}

/* Video Circle */

.play{

margin:25px auto;

width:90px;
height:90px;

border-radius:50%;

background:#00ffd5;

display:flex;

justify-content:center;
align-items:center;

font-size:35px;

cursor:pointer;

animation:pulse 2s infinite;

box-shadow:

0 0 25px cyan;

}

@keyframes pulse{

50%{

transform:scale(1.12);

box-shadow:

0 0 45px cyan;

}

}

/* Buttons */

.buy{

margin-top:20px;

width:100%;

padding:15px;

border:none;

border-radius:50px;

background:#00d26a;

font-size:18px;

font-weight:bold;

color:white;

cursor:pointer;

}

.buy:hover{

transform:scale(1.03);

}

/* Features */

.features{

padding:60px 20px;

display:grid;

gap:18px;

}

.feature{

padding:20px;

border-radius:18px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.15);

opacity:0;

transform:translateY(60px);

transition:1s;

}

.feature.show{

opacity:1;

transform:none;

}

/* Video Popup */

.popup{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.85);

display:none;

justify-content:center;
align-items:center;

z-index:999;

}

.popup video{

width:90%;

max-width:900px;

border-radius:20px;

}

.close{

position:absolute;

top:20px;

right:20px;

font-size:35px;

cursor:pointer;

}
.videoWall{

position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;

background:rgba(0,0,0,.15);
backdrop-filter:blur(0px);

visibility:hidden;
opacity:0;

transition:.6s;

z-index:9999;

}

.videoWall.active{

visibility:visible;
opacity:1;

backdrop-filter:blur(20px);

}

.videoBackdrop{

position:absolute;
inset:0;

background:

radial-gradient(circle at center,

rgba(0,255,255,.08),

rgba(0,0,0,.9));

animation:cinemaGlow 6s infinite alternate;

}

@keyframes cinemaGlow{

0%{

filter:hue-rotate(0deg);

}

100%{

filter:hue-rotate(40deg);

}

}

.videoContainer{

position:relative;

width:min(1000px,92vw);

border-radius:26px;

overflow:hidden;

transform:

perspective(1400px)

rotateX(18deg)

scale(.65);

opacity:0;

transition:.7s cubic-bezier(.22,1,.36,1);

box-shadow:

0 0 40px rgba(0,255,255,.2),

0 0 120px rgba(0,255,255,.15),

0 60px 120px rgba(0,0,0,.7);

}

.videoWall.active .videoContainer{

transform:

perspective(1400px)

rotateX(0deg)

scale(1);

opacity:1;

}

.videoContainer::before{

content:"";

position:absolute;
inset:0;

padding:2px;

border-radius:26px;

background:

linear-gradient(

90deg,

cyan,

#66aaff,

cyan);

background-size:300%;

animation:borderMove 5s linear infinite;

-webkit-mask:

linear-gradient(#fff 0 0) content-box,

linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;

}

@keyframes borderMove{

to{

background-position:300%;

}

}

.videoContainer video{

display:block;

width:100%;

background:black;

}

.closeVideo{

position:absolute;

top:18px;
right:18px;

width:48px;
height:48px;

border:none;

border-radius:50%;

background:rgba(255,255,255,.12);

color:white;

font-size:26px;

cursor:pointer;

backdrop-filter:blur(15px);

transition:.35s;

z-index:5;

}

.closeVideo:hover{

transform:rotate(90deg) scale(1.1);

background:#00d4ff;

box-shadow:0 0 25px cyan;

  }
</style>

</head>

<body>

<div class="bg"></div>

<div class="glow g1"></div>

<div class="glow g2"></div>

<section class="hero">

<div class="product">

<img src="product.jpg">

<h1>Future Smart Bottle</h1>

<div class="rating">
★★★★★ 4.9
</div>

<p class="desc">

Stay hydrated with
temperature tracking,
premium insulation,
and eco-friendly design.

</p>

<div class="play">

▶

</div>

<button class="buy">

BUY NOW

</button>

</div>

</section>

<section class="features">

<div class="feature">
💧 Smart Temperature Sensor
</div>

<div class="feature">
🔋 7 Day Battery
</div>

<div class="feature">
🌱 Eco Friendly Material
</div>

<div class="feature">
📱 Mobile App Support
</div>

<div class="feature">
🛡 Waterproof Design
</div>

</section>

<div class="videoWall" id="videoWall">

    <div class="videoBackdrop"></div>

    <div class="videoContainer">

        <button class="closeVideo">&times;</button>

        <video controls>
            <source src="20260720_211701.mp4">
        </video>

    </div>

</div>

<script>

const wall=document.getElementById("videoWall");

const play=document.querySelector(".play");

const close=document.querySelector(".closeVideo");

const video=document.querySelector(".videoContainer video");

play.onclick=()=>{

wall.classList.add("active");

video.play();

}

close.onclick=()=>{

wall.classList.remove("active");

video.pause();

video.currentTime=0;

}

wall.onclick=e=>{

if(e.target===wall){

wall.classList.remove("active");

video.pause();

video.currentTime=0;

}

}

const observer=new IntersectionObserver(entries=>{

entries.forEach(e=>{

if(e.isIntersecting){

e.target.classList.add("show");

}

})

})

document.querySelectorAll(".feature").forEach(card=>{

observer.observe(card);

})

</script>

</body>
  </html>
