<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Shopping Assistant</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{padding:16px;background:#181818;position:sticky;top:0}
#chat{padding:12px;max-width:900px;margin:auto}
.msg{margin:10px 0;padding:12px;border-radius:12px}
.user{background:#2563eb}
.bot{background:#222}
.cards{display:flex;gap:12px;overflow:auto}
.card{min-width:180px;background:#1d1d1d;padding:10px;border-radius:10px;cursor:pointer}
button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}
#controls{display:flex;gap:8px;position:fixed;bottom:0;left:0;right:0;padding:10px;background:#181818}
input{flex:1;padding:10px;border-radius:10px;border:0}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;padding:20px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.suggest{display:flex;gap:8px;overflow:auto;margin:10px 0}
.chip{background:#333;padding:8px 12px;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
<header><h2>🤖 AI Shopping Assistant</h2></header>
<div id="chat">
<div class="bot msg">Welcome! Try: <b>laptop</b>, <b>mouse</b>, <b>coffee</b>.</div>
<div class="suggest">
<div class="chip" onclick="ask('laptop')">💻 Laptop</div>
<div class="chip" onclick="ask('mouse')">🖱 Mouse</div>
<div class="chip" onclick="ask('coffee')">☕ Coffee</div>
<div class="chip" onclick="scratch()">🎫 Scratch</div>
<div class="chip" onclick="spin()">🎡 Spin</div>
</div>
<div id="results"></div>
</div>

<div id="popup"></div>

<div id="controls">
<input id="q" placeholder="Ask for a product...">
<button onclick="search()">Send</button>
</div>

<script>
const products=[
{name:"Gaming Laptop",cat:"laptop",price:"₹59,999",desc:"Great for coding and gaming."},
{name:"Office Laptop",cat:"laptop",price:"₹39,999",desc:"Budget productivity laptop."},
{name:"Wireless Mouse",cat:"mouse",price:"₹799",desc:"Silent ergonomic mouse."},
{name:"Premium Coffee",cat:"coffee",price:"₹499",desc:"Fresh roasted beans."}
];

function beep(){
 const c=new (window.AudioContext||window.webkitAudioContext)();
 const o=c.createOscillator(),g=c.createGain();
 o.connect(g);g.connect(c.destination);
 o.frequency.value=700;g.gain.value=.05;o.start();
 o.stop(c.currentTime+.06);
}

function ask(t){document.getElementById("q").value=t;search();}
function search(){
beep();
const q=document.getElementById("q").value.toLowerCase();
const r=products.filter(p=>p.cat.includes(q)||p.name.toLowerCase().includes(q));
let h='<div class="bot msg">Found '+r.length+' product(s).</div><div class="cards">';
r.forEach((p,i)=>h+=`<div class="card" onclick="openCard(${products.indexOf(p)})"><b>${p.name}</b><br>${p.price}<br><small>${p.desc}</small></div>`);
h+="</div>";
if(!r.length)h='<div class="bot msg">No matching products.</div>';
document.getElementById("results").innerHTML=h;
}
function openCard(i){
beep();
const p=products[i];
popup.innerHTML=`<h2>${p.name}</h2>
<p><b>${p.price}</b></p>
<p>${p.desc}</p>
<h3>AI Recommendation</h3>
<p>This is one of the best matches based on your search.</p>
<button onclick="alert('Affiliate link placeholder')">🛒 Buy Now</button>
<button onclick="popup.style.display='none'">Close</button>`;
popup.style.display='block';
}
function scratch(){
beep();
const rewards=["10% Coupon","Free eBook","Template","Featured Product"];
alert("Scratch Reward: "+rewards[Math.floor(Math.random()*rewards.length)]);
}
function spin(){
beep();
const cats=["Laptop","Mouse","Coffee"];
alert("Wheel stopped on: "+cats[Math.floor(Math.random()*cats.length)]);
}
</script>
</body>
</html>
