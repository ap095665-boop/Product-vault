<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AI Product Discovery</title><style>
body{margin:0;background:#111;color:#fff;font-family:Arial}header{padding:16px;background:#181818;position:sticky;top:0}input{width:100%;padding:12px;border-radius:10px;border:0;background:#222;color:#fff}#chips,#cards{display:flex;overflow:auto;gap:10px;padding:12px}#cards{scroll-snap-type:x mandatory}.chip{background:#333;padding:8px 12px;border-radius:999px;cursor:pointer}.card{flex:0 0 82%;max-width:340px;scroll-snap-align:center;background:#1d1d1d;border-radius:18px;overflow:hidden;transition:.3s}.card:hover{transform:scale(1.03)}.img{height:200px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#3b82f6,#7c3aed)}.c{padding:14px}.btn{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;margin-top:10px}
</style></head><body><header><h2>🤖 AI Product Discovery</h2><input id='q' placeholder='Search...' oninput='render(this.value)'></header><div id='chips'></div><div id='cards'></div><script>
const products=[{id:'mx3s',cat:'Mouse',img:'🖱️',name:'Logitech MX Master 3S',rating:'★★★★★ 4.8',desc:'Premium wireless productivity mouse'},{id:'lap1',cat:'Laptop',img:'💻',name:'Coding Laptop',rating:'★★★★★ 4.7',desc:'Great for developers'},{id:'aud1',cat:'Audio',img:'🎧',name:'Wireless Earbuds',rating:'★★★★☆ 4.5',desc:'Noise cancelling'}];
const cats=[...new Set(products.map(p=>p.cat))];
chips.innerHTML=cats.map(c=>`<div class="chip" onclick="render('${c}')">${c}</div>`).join('');
function render(t=''){t=t.toLowerCase();cards.innerHTML=products.filter(p=>!t||p.cat.toLowerCase().includes(t)||p.name.toLowerCase().includes(t)).map(p=>`<div class="card"><div class="img">${p.img}</div><div class="c"><div><b>${p.name}</b></div><div>${p.rating}</div><div>${p.desc}</div><a class="btn" href="?product=${p.id}">View Product</a></div></div>`).join('')}
render();
const id=new URLSearchParams(location.search).get('product');if(id){const p=products.find(x=>x.id===id);if(p){document.body.innerHTML=`<header><h2>${p.name}</h2></header><div style="padding:20px"><div class="img" style="border-radius:18px">${p.img}</div><h1>${p.name}</h1><p>${p.rating}</p><p>${p.desc}</p><p>Share this URL.</p><a class="btn" href="./">Back</a></div>`}}
</script></body></html>
